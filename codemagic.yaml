# Beat Our AI — Expo → native iOS via Codemagic (same path as PrepTra / Chroma)
# Bundle ID: com.beatoireai.tictactoe

workflows:
  beat-our-ai-ios:
    name: Beat Our AI iOS (App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beatoireai.tictactoe
      vars:
        BUNDLE_ID: "com.beatoireai.tictactoe"
        # App Store Connect → App Information → Apple ID (numeric). Update if wrong.
        APP_STORE_APPLE_ID: 6832355509
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Expo prebuild iOS
        script: |
          npx expo prebuild --platform ios --non-interactive --clean
      - name: Force brand AppIcon from assets/icon.png
        script: |
          set -e
          ICON_SRC="$CM_BUILD_DIR/assets/icon.png"
          # Expo puts AppIcon under ios/<AppName>/Images.xcassets or Assets.xcassets
          DEST=$(find "$CM_BUILD_DIR/ios" -type d -name "AppIcon.appiconset" | head -1)
          echo "AppIcon set: $DEST"
          test -f "$ICON_SRC"
          test -d "$DEST"
          # Write 1024 App Store icon (required) + Contents.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          try:
              from PIL import Image
          except ImportError:
              import subprocess, sys
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pillow", "-q"])
              from PIL import Image
          src = Path(os.environ["CM_BUILD_DIR"]) / "assets" / "icon.png"
          dest = None
          for p in Path(os.environ["CM_BUILD_DIR"], "ios").rglob("AppIcon.appiconset"):
              dest = p
              break
          assert dest, "AppIcon.appiconset not found"
          im = Image.open(src).convert("RGB").resize((1024, 1024), Image.Resampling.LANCZOS)
          out = dest / "AppIcon-1024.png"
          im.save(out, "PNG")
          contents = {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {"author": "xcode", "version": 1}
          }
          (dest / "Contents.json").write_text(json.dumps(contents, indent=2), encoding="utf-8")
          print("Wrote", out, out.stat().st_size)
          PY
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing profiles
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" = "null" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi
          agvtool new-version -all "$UPDATED_BUILD_NUMBER"
      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR/ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print; exit}' | xargs)
          echo "Workspace=$WORKSPACE Scheme=$SCHEME"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$WORKSPACE" \
            --scheme "$SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload IPA to App Store Connect / TestFlight (internal). Do not auto-submit App Store.
        submit_to_testflight: true
        submit_to_app_store: false
